services:
  mysql-db:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mysql:8.0
    container_name: my_mysql
    restart: always
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Zhen8907146!!
      MYSQL_DATABASE: self_app
      TZ: Asia/Shanghai
    command: --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  node-app:
    build: .
    container_name: my_node_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql-db
      DB_USER: root
      DB_PASSWORD: Zhen8907146!!
      DB_NAME: self_app
      NODE_ENV: production
      PORT: "3000"
      TZ: Asia/Shanghai
      JWT_SECRET: ${JWT_SECRET:-self_app_dev_secret}
      TRENDRADAR_WEBHOOK_TOKEN: ${TRENDRADAR_WEBHOOK_TOKEN:-}
      NEWS_IMPORT_TOKEN: ${NEWS_IMPORT_TOKEN:-}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-http://127.0.0.1:8000}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_TIMEOUT_MS: ${AGENT_TIMEOUT_MS:-120000}
      QWEATHER_API_HOST: ${QWEATHER_API_HOST:-}
      QWEATHER_API_KEY: ${QWEATHER_API_KEY:-}
      QWEATHER_TIMEOUT_MS: ${QWEATHER_TIMEOUT_MS:-15000}
      QWEATHER_DEFAULT_LAT: ${QWEATHER_DEFAULT_LAT:-30.57}
      QWEATHER_DEFAULT_LNG: ${QWEATHER_DEFAULT_LNG:-104.07}
      QWEATHER_DEFAULT_LABEL: ${QWEATHER_DEFAULT_LABEL:-成都}
      SHOWAPI_APP_KEY: ${SHOWAPI_APP_KEY:-}
      SHOWAPI_TIMEOUT_MS: ${SHOWAPI_TIMEOUT_MS:-15000}
      SHOWAPI_BASE_URL: ${SHOWAPI_BASE_URL:-https://route.showapi.com}
      SHOWAPI_HOROSCOPE_PATH: ${SHOWAPI_HOROSCOPE_PATH:-/872-1}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ZHIPU_TEXT_MODEL: ${ZHIPU_TEXT_MODEL:-glm-4-flash}
      ZHIPU_VISION_MODEL: ${ZHIPU_VISION_MODEL:-glm-4.6v-flash}
    depends_on:
      mysql-db:
        condition: service_healthy

volumes:
  mysql_data:
